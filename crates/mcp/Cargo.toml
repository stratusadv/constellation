[package]
name = "constellation-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
constellation-graph = { path = "../graph" }
constellation-index = { path = "../index" }
constellation-store = { path = "../store" }
rmcp = { version = "1.7.0", features = ["transport-io"] }
rustc-hash = "2.1.2"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "io-std", "net", "time"] }

[lints]
workspace = true

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "rank"
harness = false
