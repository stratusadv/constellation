name: Release

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Built on the oldest supported runner rather than ubuntu-latest, because a
  # glibc-linked binary runs on the glibc it was built against or newer, never
  # older. Building on 22.04 (glibc 2.35) covers Ubuntu 22.04+, Debian 12+, and
  # Fedora 36+; building on the newest runner would exclude every one of them.
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify tag matches Cargo.toml version
      run: |
        tag="${{ github.event.release.tag_name }}"
        tag="${tag#v}"
        cargo=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/^version = "(.+)"/\1/')
        if [ "$tag" != "$cargo" ]; then
          echo "Release tag v$tag does not match Cargo.toml [workspace.package] version $cargo. Bump the version and re-tag." >&2
          exit 1
        fi
        echo "version OK: $tag"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --verbose

    # The asset name carries no version, so
    # releases/latest/download/<name>.tar.gz is a stable URL the README can
    # print once instead of a line that goes stale at every release.
    - name: Package the tarball
      run: |
        name="constellation-x86_64-unknown-linux-gnu"

        mkdir -p "dist/$name"
        cp target/release/constellation "dist/$name/"
        cp README.md LICENSE "dist/$name/"
        strip "dist/$name/constellation"

        tar -czf "dist/$name.tar.gz" -C dist "$name"
        (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

    - name: Attach the tarball to the release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.tar.gz
          dist/*.tar.gz.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify tag matches Cargo.toml version
      run: |
        $tag = "${{ github.event.release.tag_name }}" -replace '^v', ''
        $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+?)"' | Select-Object -First 1).Matches[0].Groups[1].Value
        if ($tag -ne $cargo) {
          throw "Release tag v$tag does not match Cargo.toml [workspace.package] version $cargo. Bump the version and re-tag."
        }
        Write-Host "version OK: $tag"
      shell: pwsh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Get release version
      id: get_version
      run: |
        $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Create installer with version
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" assets\installer.iss
      shell: pwsh

    - name: Rename installer
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        Move-Item "assets\Output\constellation-setup.exe" "assets\Output\constellation-setup-$version.exe"
      shell: pwsh

    - name: Upload installer artifact for signing
      id: installer_artifact
      uses: actions/upload-artifact@v4
      with:
        name: constellation-setup
        path: assets/Output/constellation-setup-${{ steps.get_version.outputs.version }}.exe

    - name: Sign installer (SignPath)
      id: sign
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
        github-artifact-id: ${{ steps.installer_artifact.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: signed

    - name: Attach signed installer to release
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      uses: softprops/action-gh-release@v1
      with:
        files: signed/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attach unsigned installer to release
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
      uses: softprops/action-gh-release@v1
      with:
        files: assets/Output/constellation-setup-${{ steps.get_version.outputs.version }}.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attach binary to release
      uses: softprops/action-gh-release@v1
      with:
        files: target/release/constellation.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-winget:
    needs: build-windows
    runs-on: windows-latest
    if: ${{ vars.PUBLISH_WINGET == 'true' }}

    steps:
    - name: Download wingetcreate
      run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
      shell: pwsh

    - name: Submit manifest to winget-pkgs
      run: |
        $tag = "${{ github.event.release.tag_name }}"
        $version = $tag -replace '^v', ''
        $url = "https://github.com/${{ github.repository }}/releases/download/$tag/constellation-setup-$version.exe"
        # Inno Setup stubs are 32-bit, so wingetcreate reads the .exe as x86 and cannot match
        # the x64/user node in the existing manifest. Pin arch|scope overrides to force the match.
        .\wingetcreate.exe update stratusadv.constellation --version $version --urls "$url|x64|user" --submit --token "${{ secrets.WINGET_TOKEN }}"
      shell: pwsh
