[workspace]
resolver = "3"
# Listed in dependency order, leaves first, so the list doubles as a reading
# order for the layer stack described in ARCHITECTURE.md.
members = [
    "crates/graph",
    "crates/resolution",
    "crates/extraction",
    "crates/store",
    "crates/linking",
    "crates/index",
    "crates/mcp",
    "crates/cli",
    "crates/eval",
    "xtask",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"

# Every dependency version is declared once, here, and every member inherits it
# with `dep.workspace = true`. Two crates in this workspace can therefore never
# disagree about a version, and a bump is one edit rather than nine.
[workspace.dependencies]
constellation-extraction = { path = "crates/extraction" }
constellation-graph = { path = "crates/graph" }
constellation-index = { path = "crates/index" }
constellation-linking = { path = "crates/linking" }
constellation-mcp = { path = "crates/mcp" }
constellation-resolution = { path = "crates/resolution" }
constellation-store = { path = "crates/store" }

anyhow = "1.0.102"
dirs = "6.0.0"
divan = "0.1.21"
ico = "0.5.0"
ignore = "0.4.26"
insta = "1.48.0"
mimalloc = "0.1.52"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
proptest = "1.11.0"
rayon = "1.12.0"
resvg = { version = "0.47.0", default-features = false }
rmcp = { version = "1.7.0", features = ["transport-io"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
rustc-hash = "2.1.2"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "io-std", "net", "time"] }
toml = "1.1.2"
tree-sitter = "0.26.9"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
winresource = "0.1.31"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind, not abort: the MCP server catches a panicking handler or watcher
# re-index and stays up, instead of one bad file or query taking down serve.
panic = "unwind"
strip = "symbols"
